<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- +-------------------------------------------------------------------+
    | [LOGO TechStore]                  [Trang chủ] [Sản phẩm] [Liên hệ] |  <-- 1. HEADER (display: flex)
    +-------------------------------------------------------------------+

    Danh mục: [Tất cả] [Laptop] [Phụ kiện] [Giảm giá]                    <-- 2. BỘ LỌC (inline-block)

    +-------------------------------------------------------------------+
    |  +-------------------+  +-------------------+  +---------------+  |
    |  | [Ảnh sản phẩm 1]  |  | [Ảnh sản phẩm 2]  |  | [Ảnh SP 3]    |  |
    |  |                   |  |                   |  |               |  |
    |  | Tai nghe Không dây|  | Bàn phím Cơ       |  | Chuột Gaming  |  |  <-- 3. DANH SÁCH SẢN PHẨM
    |  | Giá: 590.000đ     |  | Giá: 1.200.000đ   |  | Giá: 450.000đ |  |      (display: grid)
    |  | [   Mua ngay   ]  |  | [   Mua ngay   ]  |  | [  Mua ngay ] |  |
    |  +-------------------+  +-------------------+  +---------------+  |
    +-------------------------------------------------------------------+ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }

      header {
        display: flex;
        flex-direction: column;
      }

      .header--main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 24px;
        background: radial-gradient(circle at center, #112240 0%, #05071e 70%);
      }

      #header--logo__img {
        width: 100px;
        height: 100px;
        object-fit: cover;
      }

      .header--btn {
        display: flex;
        gap: 24px;
      }

      .header--btn__content {
        position: relative;
        display: inline-block;
        padding: 8px;
        cursor: pointer;
        transition: color 0.25s ease;
        color: white;
      }

      .header--btn__content:hover {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header--main">
        <div class="header--logo">
          <img
            id="header--logo__img"
            src="https://static.vecteezy.com/system/resources/previews/007/619/674/non_2x/modern-hexagon-tech-logo-designs-concept-hexa-technology-logo-template-vector.jpg"
            alt="Logo"
          />
        </div>
        <div class="header--btn">
          <span class="header--btn__content">Trang chủ</span>
          <span class="header--btn__content">Sản phẩm</span>
          <span class="header--btn__content">Liên hệ</span>
        </div>
      </div>
      <div class="header--nav">
        <p>Danh mục</p>
        
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
